<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المشنقة</title>

<style>
@font-face{font-family:Cairo;font-weight:500;src:url(fonts/cairo-arabic-500-normal.woff2) format("woff2")}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2) format("woff2")}
@font-face{font-family:'Reem Kufi';font-weight:600;src:url(fonts/reem-kufi-arabic-600-normal.woff2) format("woff2")}
@font-face{font-family:'Reem Kufi';font-weight:700;src:url(fonts/reem-kufi-arabic-700-normal.woff2) format("woff2")}
:root{--bg:#1d2b4f;--panel:#2a3b66;--tile:#e8f0fb;--ink:#14213d;--accent:#ff7a59;--ok:#3cc08f;--bad:#e8527a;--text:#f3f6fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Tahoma,sans-serif;min-height:100%;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:16px;display:flex;flex-direction:column;gap:14px}
.logo{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:swing 3.2s ease-in-out infinite}
.logo i{width:3px;height:22px;background:#d9b779;border-radius:2px;position:relative}
.logo i::after{content:"";position:absolute;bottom:-5px;left:-5px;width:13px;height:13px;border:3px solid #d9b779;border-radius:50%}
h1{font-family:'Reem Kufi',Tahoma,serif;font-size:2.8rem;margin:6px 0 0;text-align:center;background:linear-gradient(90deg,#fff08a,#ff7a59,#fff08a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite}
@keyframes swing{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
.shake{animation:shake .45s}
.heart{display:inline-block;width:1.3em;transition:transform .35s,opacity .35s,width .35s;letter-spacing:0}
.heart.gone{transform:scale(0) rotate(40deg);opacity:0;width:0}
.snd{font:inherit;font-size:1.2rem;background:none;border:0;color:var(--text);cursor:pointer}
@media(prefers-reduced-motion:reduce){.logo,h1{animation:none}}
.cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cats button{font:inherit;font-weight:700;border:2px solid var(--tile);background:transparent;color:var(--text);padding:6px 16px;border-radius:999px;cursor:pointer}
.cats button.on{background:var(--tile);color:var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:14px;padding:8px 14px;font-weight:700}
.lives{letter-spacing:3px;font-size:1.2rem}
svg{width:190px;height:212px;align-self:center}
svg .gal{stroke:var(--tile);stroke-width:5;stroke-linecap:round;fill:none}
.man{transform-origin:120px 38px;animation:dangle 2.4s ease-in-out infinite}
@keyframes dangle{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.limb{fill:none;stroke-width:6;stroke-linecap:round}
.ln{fill:none;stroke:#2b1b0e;stroke-width:2;stroke-linecap:round}
.fx{display:none}
svg[data-w="0"] .m1,svg[data-w="1"] .m1,svg[data-w="2"] .m2,svg[data-w="3"] .m2,svg[data-w="4"] .m4,svg[data-w="5"] .m4,svg[data-w="6"] .m6{display:inline}
svg[data-w="2"] .brow,svg[data-w="3"] .brow,svg[data-w="4"] .brow,svg[data-w="5"] .brow{display:inline}
svg[data-w="3"] .sweat,svg[data-w="4"] .sweat,svg[data-w="5"] .sweat{display:inline}
svg[data-w="6"] .xeyes,svg[data-w="6"] .dizzy{display:inline}
svg[data-w="6"] .eyes{display:none}
svg[data-w="5"] .eyes circle:nth-child(odd){r:5.5}
svg[data-w="6"] .man{animation-duration:.5s}
@media(prefers-reduced-motion:reduce){.man{animation:none}}
.part{display:none}.part.show{display:inline;transform-box:fill-box;transform-origin:50% 0;animation:pop .45s}
.word{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px;align-items:flex-end;direction:rtl}
.slot{width:38px;height:50px;border-bottom:4px solid var(--tile);font-family:'Reem Kufi',Tahoma,serif;font-size:2rem;text-align:center;line-height:50px}
.slot.gap{border:0;width:16px}
.slot.miss{color:var(--bad)}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.kb button{font:inherit;font-size:1.25rem;font-weight:700;height:46px;border:0;border-radius:10px;background:var(--tile);color:var(--ink);cursor:pointer}
.kb button:disabled{cursor:default;opacity:.9}
.kb button.hit{background:var(--ok);color:#06251a}
.kb button.miss{background:var(--bad);color:#fff;opacity:.55}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rope{font:inherit;font-weight:700;font-size:1.2rem;border:0;border-radius:14px;padding:11px;color:#3a2a00;cursor:pointer;background:linear-gradient(180deg,#fff08a 0%,#ffc933 55%,#ffa800 100%);box-shadow:0 4px 0 #b37e00,0 8px 16px rgba(255,184,0,.25)}
.rope:active{transform:translateY(3px);box-shadow:0 1px 0 #b37e00}
.rope:disabled{opacity:.5;cursor:default}
.hint{background:var(--panel);border-radius:14px;padding:12px;text-align:center}
.pic{font-size:4.2rem;line-height:1.2;transition:filter .5s}
.clue{font-weight:700;margin-top:4px}
.msg{text-align:center;min-height:2.2em;font-weight:700;font-size:1.15rem}
.next{font:inherit;font-weight:700;font-size:1.1rem;border:0;border-radius:12px;background:var(--accent);color:#2b0f06;padding:12px;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2b4f}}
</style>
</head>
<body>
<main>
  <div class="logo"><i></i><h1>المشنقة</h1></div>
  <div class="cats" id="cats"></div>
  <div class="bar"><span id="score">النقاط: ٠</span><button class="snd" id="snd" aria-label="الصوت">🔊</button><span class="lives" id="lives"></span></div>
  <svg id="man" data-w="0" viewBox="0 0 170 190" aria-hidden="true">
    <path class="gal" d="M20 180H110M45 180V15H120V38"/>

    <g class="part" data-s="1">
      <circle cx="120" cy="58" r="18" fill="#ffd166" stroke="#2b1b0e" stroke-width="2.5"/>
      <path class="ln" d="M110 41Q114 34 118 41M122 40Q126 34 130 41" style="stroke:#ffd166;stroke-width:3"/>
      <g class="eyes"><circle cx="113" cy="55" r="4.5" fill="#fff"/><circle cx="127" cy="55" r="4.5" fill="#fff"/><circle cx="114" cy="56" r="2" fill="#2b1b0e"/><circle cx="126" cy="56" r="2" fill="#2b1b0e"/></g>
      <g class="fx xeyes"><path class="ln" d="M109 51L117 59M117 51L109 59M123 51L131 59M131 51L123 59"/></g>
      <g class="fx brow"><path class="ln" d="M108 47L117 50M132 47L123 50"/></g>
      <g class="fx m1"><path class="ln" d="M113 66Q120 72 127 66"/></g>
      <g class="fx m2"><path class="ln" d="M112 68Q116 64 120 68T128 68"/></g>
      <g class="fx m4"><ellipse cx="120" cy="68" rx="5" ry="6" fill="#7a1f2b" stroke="#2b1b0e" stroke-width="2"/></g>
      <g class="fx m6"><path class="ln" d="M112 66Q120 63 128 66"/><path d="M118 66v9a3 3 0 0 0 6 0v-9z" fill="#ff5d8f" stroke="#2b1b0e" stroke-width="2"/></g>
      <g class="fx sweat"><path d="M139 46q-5 8 0 10q5-2 0-10z" fill="#7fd6ff"/></g>
      <g class="fx dizzy"><text x="140" y="38" font-size="14">💫</text><text x="86" y="38" font-size="14">💫</text></g>
    </g>
    <g class="part" data-s="2">
      <ellipse cx="120" cy="98" rx="15" ry="21" fill="#ff7a59" stroke="#2b1b0e" stroke-width="2.5"/>
      <circle cx="120" cy="92" r="2" fill="#2b1b0e"/><circle cx="120" cy="100" r="2" fill="#2b1b0e"/><circle cx="120" cy="108" r="2" fill="#2b1b0e"/>
    </g>
    <g class="part" data-s="3"><path class="limb" stroke="#ffd166" d="M107 90Q94 90 90 104"/><circle cx="89" cy="107" r="5" fill="#fff" stroke="#2b1b0e" stroke-width="2"/></g>
    <g class="part" data-s="4"><path class="limb" stroke="#ffd166" d="M133 90Q146 90 150 76"/><circle cx="151" cy="73" r="5" fill="#fff" stroke="#2b1b0e" stroke-width="2"/></g>
    <g class="part" data-s="5"><path class="limb" stroke="#4cc9f0" d="M114 116L106 150"/><ellipse cx="100" cy="155" rx="9" ry="5" fill="#fff" stroke="#2b1b0e" stroke-width="2"/></g>
    <g class="part" data-s="6"><path class="limb" stroke="#4cc9f0" d="M126 116L136 146"/><ellipse cx="143" cy="150" rx="9" ry="5" fill="#fff" stroke="#2b1b0e" stroke-width="2" transform="rotate(-20 143 150)"/></g>
    </g>
  </svg>
  <div class="word" id="word"></div>
  <button class="rope" id="hintBtn">فك الحبل</button>
  <div class="hint" id="hint" hidden><div class="pic" id="pic"></div><div class="clue" id="clue"></div></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="kb" id="kb"></div>
  <button class="next" id="next" hidden>كلمة جديدة</button>
</main>

function shake(){const m=document.querySelector("main");m.classList.remove("shake");void m.offsetWidth;m.classList.add("shake");try{navigator.vibrate&&navigator.vibrate(150)}catch(e){}}
$("snd").onclick=()=>{muted=!muted;$("snd").textContent=muted?"🔇":"🔊";if(muted)try{Object.values(VOICE).forEach(a=>a.pause())}catch(e){}};
function renderCats(){$("cats").innerHTML="";Object.keys(DATA).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.className=k===cat?"on":"";b.onclick=()=>{cat=k;renderCats();start()};$("cats").appendChild(b)})}
function start(){
  const list=DATA[cat].filter(x=>x[0]!==last);
  cur=list[Math.floor(Math.random()*list.length)];answer=cur[0];last=answer;hintLvl=0;
  $("lives").innerHTML='<span class="heart">❤️</span>'.repeat(6);$("hint").hidden=true;$("hintBtn").disabled=false;$("hintBtn").textContent="فك الحبل";
  need=new Set([...answer].filter(c=>c!==" ").map(norm));
  guessed=new Set();wrong=0;over=false;
  $("msg").textContent="خمّني الحرف الأول";$("next").hidden=true;
  $("kb").innerHTML="";
  LETTERS.forEach(l=>{const b=document.createElement("button");b.textContent=l;b.dataset.l=l;b.onclick=()=>guess(l);$("kb").appendChild(b)});
  draw();
}
function guess(l){
  if(over||guessed.has(l))return;
  guessed.add(l);
  const btn=document.querySelector(`[data-l="${l}"]`);btn.disabled=true;
  const good=need.has(l);
  if(good){btn.className="hit"}else{btn.className="miss";wrong++;shake()}
  draw();
  const won=[...need].every(c=>guessed.has(c));
  if(won){over=true;score+=need.size+(6-wrong);$("msg").textContent="برافو! كسبتي 🎉";sfx.win();end()}
  else if(wrong>=6){over=true;$("msg").textContent="خسرتي! الإجابة: "+answer;sfx.lose();end()}
  else good?sfx.ok():sfx.bad();
}
function hint(){
  if(over||hintLvl>=3)return;
  hintLvl++;score=Math.max(0,score-1);
  const h=$("hint");h.hidden=false;
  $("pic").textContent=cur[1];
  $("pic").style.filter=hintLvl===1?"blur(14px)":"blur(4px)";
  $("clue").textContent=hintLvl>=2?"💬 "+cur[2]:"افتكري الصورة الغامضة…";
  if(hintLvl===3){const left=[...need].filter(c=>!guessed.has(c));if(left.length>1)guess(left[Math.floor(Math.random()*left.length)]);$("clue").textContent="💬 "+cur[2]+" — وفتحتلك حرف!"}
  $("hintBtn").textContent=hintLvl<3?"فك الحبل ("+ar(3-hintLvl)+")":"خلصت التلميحات";
  if(hintLvl>=3)$("hintBtn").disabled=true;
  draw();
}
function end(){$("hintBtn").disabled=true;$("next").hidden=false;$("next").focus();draw(true)}
function draw(reveal){
  $("score").textContent="النقاط: "+ar(score);
  [...$("lives").children].forEach((h,i)=>h.classList.toggle("gone",i>=6-wrong));
  $("man").dataset.w=wrong;document.querySelectorAll(".part").forEach(p=>p.classList.toggle("show",+p.dataset.s<=wrong));
  $("word").innerHTML="";
  [...answer].forEach(c=>{
    const s=document.createElement("span");s.className="slot";
    if(c===" "){s.className="slot gap"}
    else if(guessed.has(norm(c))){s.textContent=c}
    else if(reveal&&wrong>=6){s.textContent=c;s.className="slot miss"}
    $("word").appendChild(s)});
}
document.addEventListener("keydown",e=>{const l=norm(e.key);if(LETTERS.includes(l)&&l.length===1)guess(l)});
$("next").onclick=start;$("hintBtn").onclick=hint;
renderCats();start();
</script>
</body>
</html>
